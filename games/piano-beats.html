<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Tiles - Enhanced</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
            display: flex;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }

        /* Theme Variables */
        body.classic-theme {
            --bg-color: #fff;
            --tile-color: #000;
            --tile-clicked: #aaa;
            --grid-line: #ccc;
            --score-color: #ff0055;
            --button-bg: #ff0055;
            --button-text: white;
            --overlay-bg: rgba(0, 0, 0, 0.8);
            --start-tile: #ffff00;
            background: #fff;
        }

        body.cyberpunk-theme {
            --bg-color: #0a0a1a;
            --tile-color: linear-gradient(145deg, #00ffff 0%, #00aaff 100%);
            --tile-clicked: rgba(0, 245, 255, 0.3);
            --grid-line: rgba(0, 245, 255, 0.3);
            --score-color: #00f5ff;
            --button-bg: linear-gradient(135deg, #00f5ff 0%, #ff00e5 100%);
            --button-text: #0a0a1a;
            --overlay-bg: rgba(10, 10, 26, 0.95);
            --start-tile: #ff00e5;
            --neon-glow: #00f5ff;
            --neon-secondary: #ff00e5;
            background: #0a0a1a;
        }

        body.longtile-theme {
            --bg-color: #1a0a2e;
            --tile-color: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
            --tile-clicked: rgba(83, 92, 145, 0.5);
            --grid-line: rgba(83, 92, 145, 0.4);
            --score-color: #e94560;
            --button-bg: linear-gradient(135deg, #e94560 0%, #533483 100%);
            --button-text: white;
            --overlay-bg: rgba(26, 10, 46, 0.95);
            --start-tile: #e94560;
            --neon-glow: #e94560;
            --neon-secondary: #533483;
            --long-tile-gradient: linear-gradient(180deg, #e94560 0%, #533483 50%, #e94560 100%);
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 100%);
        }

        canvas {
            display: block;
            background: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        body.cyberpunk-theme canvas {
            background: #0a0a1a;
            box-shadow: 0 0 40px rgba(0, 245, 255, 0.4), 0 0 80px rgba(255, 0, 229, 0.2);
        }

        body.longtile-theme canvas {
            background: #1a0a2e;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.4), 0 0 80px rgba(83, 52, 131, 0.2);
        }

        /* Grid Backgrounds */
        body.cyberpunk-theme::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        body.longtile-theme::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(233, 69, 96, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(83, 52, 131, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* HUD Overlay */
        #hudOverlay {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        body.cyberpunk-theme #hudOverlay.active,
        body.longtile-theme #hudOverlay.active {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-top {
            width: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.5) 50%, transparent 100%);
            padding: 24px 0 32px;
            font-family: 'Orbitron', sans-serif;
        }

        .hud-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px 8px;
        }

        .pause-btn {
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: #00f5ff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        body.longtile-theme .pause-btn {
            color: #e94560;
        }

        .pause-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .stats-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 16px;
            transform: skewX(-6deg);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            border-left: 2px solid rgba(0, 245, 255, 0.5);
            padding-left: 8px;
            flex: 1;
        }

        body.longtile-theme .stat-item {
            border-left: 2px solid rgba(233, 69, 96, 0.5);
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            color: #00f5ff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        body.longtile-theme .stat-value {
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .stat-multiplier {
            color: #ff00e5;
            font-weight: 900;
        }

        body.longtile-theme .stat-multiplier {
            color: #533483;
        }

        .progress-container {
            padding: 16px 16px 0;
            transform: skewX(-3deg);
        }

        .progress-time {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 4px;
        }

        .progress-time span {
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #00f5ff 0%, #ff00e5 100%);
            border-radius: 9999px;
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
            transition: width 0.1s linear;
        }

        body.longtile-theme .progress-fill {
            background: linear-gradient(to right, #e94560 0%, #533483 100%);
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .hud-bottom {
            width: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.5) 50%, transparent 100%);
            padding: 80px 0 24px;
            font-family: 'Orbitron', sans-serif;
        }

        .song-info {
            padding: 0 16px;
            transform: skewY(1deg);
        }

        .song-title {
            color: #00f5ff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        body.longtile-theme .song-title {
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .song-artist {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            color: var(--score-color);
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px white;
            z-index: 5;
            transition: all 0.3s ease;
        }

        body.classic-theme #score {
            display: block;
        }

        body.cyberpunk-theme #score,
        body.longtile-theme #score {
            display: none;
        }

        #themeSelector,
        #startScreen,
        #gameOver,
        #pauseMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        body.cyberpunk-theme #themeSelector,
        body.cyberpunk-theme #startScreen,
        body.cyberpunk-theme #gameOver,
        body.cyberpunk-theme #pauseMenu,
        body.longtile-theme #themeSelector,
        body.longtile-theme #startScreen,
        body.longtile-theme #gameOver,
        body.longtile-theme #pauseMenu {
            font-family: 'Orbitron', sans-serif;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        body.cyberpunk-theme h1 {
            background: linear-gradient(135deg, #00f5ff 0%, #ff00e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(0, 245, 255, 0.5));
        }

        body.longtile-theme h1 {
            background: linear-gradient(135deg, #e94560 0%, #533483 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.5));
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        body.cyberpunk-theme button,
        body.longtile-theme button {
            border: 2px solid #00f5ff;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.4), inset 0 0 10px rgba(0, 245, 255, 0.1);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        body.longtile-theme button {
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4), inset 0 0 10px rgba(233, 69, 96, 0.1);
        }

        body.cyberpunk-theme button:hover {
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.6), inset 0 0 15px rgba(0, 245, 255, 0.2);
        }

        body.longtile-theme button:hover {
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.6), inset 0 0 15px rgba(233, 69, 96, 0.2);
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 30px 0;
            max-width: 700px;
            width: 100%;
        }

        .theme-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .theme-card:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
        }

        body.cyberpunk-theme .theme-card,
        body.longtile-theme .theme-card {
            background: rgba(0, 245, 255, 0.05);
            border: 2px solid rgba(0, 245, 255, 0.3);
        }

        body.longtile-theme .theme-card {
            background: rgba(233, 69, 96, 0.05);
            border: 2px solid rgba(233, 69, 96, 0.3);
        }

        body.cyberpunk-theme .theme-card:hover,
        body.longtile-theme .theme-card:hover {
            background: rgba(0, 245, 255, 0.1);
            border-color: #00f5ff;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }

        body.longtile-theme .theme-card:hover {
            background: rgba(233, 69, 96, 0.1);
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }

        .theme-preview {
            width: 100%;
            height: 100px;
            border-radius: 5px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .theme-preview-classic {
            background: white;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
        }

        .theme-preview-classic>div {
            background: #000;
        }

        .theme-preview-cyberpunk {
            background: #0a0a1a;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
        }

        .theme-preview-cyberpunk>div {
            background: linear-gradient(145deg, #00ffff 0%, #00aaff 100%);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .theme-preview-longtile {
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 100%);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            position: relative;
        }

        .theme-preview-longtile>div {
            background: linear-gradient(180deg, #e94560 0%, #533483 100%);
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .theme-preview-longtile>div:first-child {
            grid-row: span 2;
            background: linear-gradient(180deg, #e94560 0%, #533483 50%, #e94560 100%);
            animation: longTilePreview 2s ease-in-out infinite;
        }

        @keyframes longTilePreview {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .theme-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 10px;
        }

        p.subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        .combo-animation {
            animation: pulse 0.3s ease-out;
        }

        @keyframes longTileShimmer {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 0% 100%;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }

            button {
                padding: 12px 30px;
                font-size: 1.2rem;
            }

            .stat-value {
                font-size: 16px;
            }

            .stat-label {
                font-size: 9px;
            }

            .song-title {
                font-size: 14px;
            }

            .song-artist {
                font-size: 12px;
            }

            .theme-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }

            .theme-card {
                padding: 20px;
            }

            .theme-preview {
                height: 80px;
            }
        }
    </style>
</head>

<body class="classic-theme">
    <canvas id="gameCanvas"></canvas>
    <div id="score">0</div>

    <!-- HUD Overlay -->
    <div id="hudOverlay">
        <div class="hud-top">
            <div class="hud-header">
                <div style="width: 48px;"></div>
                <button class="pause-btn" onclick="togglePause()">
                    <span class="material-symbols-outlined" id="pauseIcon">pause</span>
                </button>
            </div>
            <div class="stats-container">
                <div class="stat-item">
                    <p class="stat-label">Score</p>
                    <p class="stat-value" id="hudScore">0</p>
                </div>
                <div class="stat-item">
                    <p class="stat-label">Combo</p>
                    <p class="stat-value" id="hudCombo">0 <span class="stat-multiplier" id="hudMultiplier">(x1)</span>
                    </p>
                </div>
                <div class="stat-item">
                    <p class="stat-label">Accuracy</p>
                    <p class="stat-value" id="hudAccuracy">100%</p>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-time">
                    <span id="progressTime">0:00 / 3:00</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="song-info">
                <p class="song-title" id="songTitle">Synthwave Serenade</p>
                <p class="song-artist" id="songArtist">Neon Dreamers</p>
            </div>
        </div>
    </div>

    <!-- Theme Selector -->
    <div id="themeSelector">
        <h1>PIANO TILES</h1>
        <p class="subtitle">Choose Your Theme</p>
        <div class="theme-grid">
            <div class="theme-card" onclick="selectTheme('classic')">
                <div class="theme-preview theme-preview-classic">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="theme-name">Classic</div>
            </div>
            <div class="theme-card" onclick="selectTheme('cyberpunk')">
                <div class="theme-preview theme-preview-cyberpunk">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="theme-name">Cyberpunk</div>
            </div>
            <div class="theme-card" onclick="selectTheme('longtile')">
                <div class="theme-preview theme-preview-longtile">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <div class="theme-name">Long Tile</div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="hidden">
        <h1>PIANO TILES</h1>
        <p class="subtitle" id="themeDesc">Don't tap the white tiles!</p>
        <button onclick="startGame()">START GAME</button>
        <button onclick="backToThemes()" style="font-size: 1rem; padding: 10px 30px;">Change Theme</button>
    </div>

    <!-- Pause Menu -->
    <div id="pauseMenu" class="hidden">
        <h1>PAUSED</h1>
        <p class="subtitle">Score: <span id="pauseScore">0</span></p>
        <button onclick="togglePause()">RESUME</button>
        <button onclick="restartGame()" style="font-size: 1.2rem;">RESTART</button>
        <button onclick="quitToMenu()" style="font-size: 1rem; padding: 10px 30px;">QUIT</button>
    </div>

    <!-- Game Over -->
    <div id="gameOver" class="hidden">
        <h1>GAME OVER</h1>
        <p class="subtitle">Score: <span id="finalScore">0</span></p>
        <p class="subtitle">Max Combo: <span id="finalCombo">0</span></p>
        <p class="subtitle">Accuracy: <span id="finalAccuracy">0</span>%</p>
        <button onclick="startGame()">RETRY</button>
        <button onclick="backToThemes()" style="font-size: 1rem; padding: 10px 30px;">Change Theme</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const COLS = 4;
        let colWidth;
        let rowHeight;
        let currentTheme = 'classic';

        let tiles = [];
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let multiplier = 1;
        let totalTaps = 0;
        let perfectTaps = 0;
        let speed = 5;
        let gameRunning = false;
        let gamePaused = false;
        let offset = 0;
        let gameStartTime = 0;
        let gameDuration = 180000;
        let currentHoldTile = null;
        let holdStartTime = 0;
        let longTilesEnabled = false;

        function resize() {
            width = Math.min(window.innerWidth, 500);
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            colWidth = width / COLS;
            rowHeight = height / 4;
        }
        window.addEventListener('resize', resize);
        resize();

        class Tile {
            constructor(row, isLong = false) {
                this.row = row;
                this.col = Math.floor(Math.random() * COLS);
                this.y = height - (row + 1) * rowHeight;
                this.clicked = false;
                this.isLong = isLong;
                this.isHolding = false;
                this.holdProgress = 0;
                this.longDuration = isLong ? (rowHeight * (2 + Math.random() * 2)) : 0;
                this.animationOffset = Math.random() * Math.PI * 2;
                this.updateColor();
            }

            updateColor() {
                if (currentTheme === 'cyberpunk') {
                    this.color = null;
                    this.isCyberpunk = true;
                } else if (currentTheme === 'longtile') {
                    this.color = null;
                    this.isLongTile = true;
                } else {
                    this.color = "#000";
                    this.isCyberpunk = false;
                    this.isLongTile = false;
                }
            }

            draw(yOffset) {
                const x = this.col * colWidth;
                let y = this.y + yOffset;
                let tileHeight = rowHeight;

                if (this.isLong) {
                    tileHeight = this.longDuration;
                }

                if (this.isLongTile) {
                    this.drawLongTileTheme(x, y, tileHeight);
                } else if (this.isCyberpunk) {
                    this.drawCyberpunkTheme(x, y, tileHeight);
                } else {
                    this.drawClassicTheme(x, y, tileHeight);
                }
            }

            drawClassicTheme(x, y, tileHeight) {
                ctx.fillStyle = this.clicked ? "#aaa" : this.color;
                ctx.fillRect(x, y, colWidth - 1, tileHeight - 1);
                ctx.strokeStyle = "#ccc";
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, colWidth, tileHeight);
            }

            drawCyberpunkTheme(x, y, tileHeight) {
                if (this.clicked && !this.isHolding) {
                    ctx.fillStyle = "rgba(0, 245, 255, 0.3)";
                    ctx.fillRect(x, y, colWidth - 1, tileHeight - 1);
                } else {
                    const gradient = ctx.createLinearGradient(x, y, x + colWidth, y + tileHeight);
                    gradient.addColorStop(0, '#00ffff');
                    gradient.addColorStop(1, '#00aaff');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, y, colWidth - 2, tileHeight - 2);

                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, colWidth - 2, tileHeight - 2);

                    ctx.shadowColor = 'rgba(0, 255, 255, 0.5)';
                    ctx.shadowBlur = 15;
                    ctx.strokeRect(x, y, colWidth - 2, tileHeight - 2);
                    ctx.shadowBlur = 0;
                }

                ctx.strokeStyle = "rgba(0, 245, 255, 0.3)";
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, colWidth, tileHeight);
            }

            drawLongTileTheme(x, y, tileHeight) {
                if (this.isLong) {
                    const time = Date.now() / 1000;
                    const shimmer = Math.sin(time * 2 + this.animationOffset) * 0.3 + 0.7;

                    if (this.isHolding) {
                        const completedHeight = tileHeight * this.holdProgress;

                        // Completed part (darker)
                        const completedGradient = ctx.createLinearGradient(x, y, x, y + completedHeight);
                        completedGradient.addColorStop(0, 'rgba(83, 52, 131, 0.6)');
                        completedGradient.addColorStop(1, 'rgba(83, 52, 131, 0.8)');
                        ctx.fillStyle = completedGradient;
                        ctx.fillRect(x, y, colWidth - 2, completedHeight);

                        // Remaining part (animated)
                        const remainingGradient = ctx.createLinearGradient(x, y + completedHeight, x, y + tileHeight);
                        remainingGradient.addColorStop(0, `rgba(233, 69, 96, ${shimmer})`);
                        remainingGradient.addColorStop(0.5, `rgba(83, 52, 131, ${shimmer * 0.8})`);
                        remainingGradient.addColorStop(1, `rgba(233, 69, 96, ${shimmer})`);
                        ctx.fillStyle = remainingGradient;
                        ctx.fillRect(x, y + completedHeight, colWidth - 2, tileHeight - completedHeight);

                        // Progress line
                        ctx.strokeStyle = `rgba(233, 69, 96, ${shimmer})`;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(x, y + completedHeight);
                        ctx.lineTo(x + colWidth - 2, y + completedHeight);
                        ctx.stroke();

                        ctx.shadowColor = 'rgba(233, 69, 96, 0.8)';
                        ctx.shadowBlur = 20;
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    } else {
                        // Not holding yet
                        const gradient = ctx.createLinearGradient(x, y, x, y + tileHeight);
                        gradient.addColorStop(0, `rgba(233, 69, 96, ${shimmer})`);
                        gradient.addColorStop(0.5, `rgba(83, 52, 131, ${shimmer * 0.8})`);
                        gradient.addColorStop(1, `rgba(233, 69, 96, ${shimmer})`);
                        ctx.fillStyle = gradient;
                        ctx.fillRect(x, y, colWidth - 2, tileHeight);
                    }

                    // Border
                    ctx.strokeStyle = '#e94560';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, colWidth - 2, tileHeight);

                    ctx.shadowColor = 'rgba(233, 69, 96, 0.5)';
                    ctx.shadowBlur = 15;
                    ctx.strokeRect(x, y, colWidth - 2, tileHeight);
                    ctx.shadowBlur = 0;
                } else {
                    // Normal tile
                    if (this.clicked) {
                        ctx.fillStyle = "rgba(83, 92, 145, 0.5)";
                        ctx.fillRect(x, y, colWidth - 1, tileHeight - 1);
                    } else {
                        const gradient = ctx.createLinearGradient(x, y, x + colWidth, y + tileHeight);
                        gradient.addColorStop(0, '#16213e');
                        gradient.addColorStop(1, '#0f3460');
                        ctx.fillStyle = gradient;
                        ctx.fillRect(x, y, colWidth - 2, tileHeight - 2);

                        ctx.strokeStyle = '#535c91';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x, y, colWidth - 2, tileHeight - 2);

                        ctx.shadowColor = 'rgba(83, 92, 145, 0.4)';
                        ctx.shadowBlur = 10;
                        ctx.strokeRect(x, y, colWidth - 2, tileHeight - 2);
                        ctx.shadowBlur = 0;
                    }
                }

                ctx.strokeStyle = "rgba(83, 92, 145, 0.4)";
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, colWidth, tileHeight);
            }
        }

        function updateComboMultiplier() {
            if (combo >= 50) multiplier = 8;
            else if (combo >= 32) multiplier = 6;
            else if (combo >= 16) multiplier = 4;
            else if (combo >= 8) multiplier = 2;
            else multiplier = 1;
        }

        function updateHUD() {
            if (currentTheme === 'cyberpunk' || currentTheme === 'longtile') {
                document.getElementById('hudScore').textContent = score.toLocaleString();
                document.getElementById('hudCombo').innerHTML = `${combo} <span class="stat-multiplier">(x${multiplier})</span>`;

                const accuracy = totalTaps > 0 ? ((perfectTaps / totalTaps) * 100).toFixed(1) : 100;
                document.getElementById('hudAccuracy').textContent = accuracy + '%';

                const elapsed = Date.now() - gameStartTime;
                const progress = Math.min((elapsed / gameDuration) * 100, 100);
                document.getElementById('progressFill').style.width = progress + '%';

                const elapsedSec = Math.floor(elapsed / 1000);
                const totalSec = Math.floor(gameDuration / 1000);
                const elapsedMin = Math.floor(elapsedSec / 60);
                const elapsedSecRem = elapsedSec % 60;
                const totalMin = Math.floor(totalSec / 60);
                const totalSecRem = totalSec % 60;
                document.getElementById('progressTime').textContent =
                    `${elapsedMin}:${elapsedSecRem.toString().padStart(2, '0')} / ${totalMin}:${totalSecRem.toString().padStart(2, '0')}`;
            } else {
                document.getElementById('score').innerText = score;
            }
        }

        function selectTheme(theme) {
            currentTheme = theme;
            document.body.className = theme + '-theme';
            document.getElementById('themeSelector').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');

            // Update descriptions
            if (theme === 'classic') {
                document.getElementById('themeDesc').textContent = "Don't tap the white tiles!";
            } else if (theme === 'cyberpunk') {
                document.getElementById('themeDesc').textContent = "Neon rhythm challenge!";
                document.getElementById('songTitle').textContent = "Synthwave Serenade";
                document.getElementById('songArtist').textContent = "Neon Dreamers";
            } else if (theme === 'longtile') {
                document.getElementById('themeDesc').textContent = "Tap and hold the long tiles!";
                document.getElementById('songTitle').textContent = "Endless Flow";
                document.getElementById('songArtist').textContent = "Rhythm Masters";
            }
        }

        function backToThemes() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOver').classList.add('hidden');
            document.getElementById('themeSelector').classList.remove('hidden');
        }

        function startGame() {
            resize();
            tiles = [];
            score = 0;
            combo = 0;
            maxCombo = 0;
            multiplier = 1;
            totalTaps = 0;
            perfectTaps = 0;
            speed = 5;
            offset = 0;
            gamePaused = false;
            gameStartTime = Date.now();
            currentHoldTile = null;
            holdStartTime = 0;
            longTilesEnabled = false;

            updateHUD();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOver').classList.add('hidden');
            document.getElementById('pauseMenu').classList.add('hidden');

            if (currentTheme === 'cyberpunk' || currentTheme === 'longtile') {
                document.getElementById('hudOverlay').classList.add('active');
            } else {
                document.getElementById('hudOverlay').classList.remove('active');
            }

            for (let i = 0; i < 6; i++) {
                let t = new Tile(i, false);
                t.y = height - (i + 1) * rowHeight;
                tiles.push(t);
            }

            if (currentTheme === 'cyberpunk') {
                tiles[0].color = '#ff00e5';
                tiles[0].isCyberpunk = false;
            } else if (currentTheme === 'longtile') {
                tiles[0].color = '#e94560';
                tiles[0].isLongTile = false;
            } else {
                tiles[0].color = "#ffff00";
            }
            tiles[0].isStart = true;

            gameRunning = true;
            loop();
        }

        function restartGame() {
            startGame();
        }

        function quitToMenu() {
            gameRunning = false;
            gamePaused = false;
            currentHoldTile = null;
            document.getElementById('pauseMenu').classList.add('hidden');
            document.getElementById('hudOverlay').classList.remove('active');
            backToThemes();
        }

        function togglePause() {
            if (!gameRunning) return;

            gamePaused = !gamePaused;

            if (gamePaused) {
                document.getElementById('pauseMenu').classList.remove('hidden');
                document.getElementById('pauseScore').textContent = score;
                document.getElementById('pauseIcon').textContent = 'play_arrow';
            } else {
                document.getElementById('pauseMenu').classList.add('hidden');
                document.getElementById('pauseIcon').textContent = 'pause';
                loop();
            }
        }

        function loop() {
            if (!gameRunning || gamePaused) return;

            ctx.clearRect(0, 0, width, height);

            // Draw grid
            if (currentTheme === 'cyberpunk') {
                ctx.strokeStyle = "rgba(0, 245, 255, 0.3)";
                ctx.lineWidth = 2;
            } else if (currentTheme === 'longtile') {
                ctx.strokeStyle = "rgba(83, 92, 145, 0.4)";
                ctx.lineWidth = 2;
            } else {
                ctx.strokeStyle = "#ccc";
                ctx.lineWidth = 1;
            }

            for (let i = 1; i < COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * colWidth, 0);
                ctx.lineTo(i * colWidth, height);
                ctx.stroke();
            }

            // Enable long tiles after score milestone
            if (currentTheme === 'longtile' && score > 500 && !longTilesEnabled) {
                longTilesEnabled = true;
            }

            if (score > 0) {
                offset += speed;
                speed += 0.005;
            }

            // Handle holding tiles
            if (currentHoldTile && currentHoldTile.isHolding) {
                const holdDuration = Date.now() - holdStartTime;
                currentHoldTile.holdProgress = Math.min(holdDuration / 1000, 1);

                // Continuous scoring while holding
                const holdScore = Math.floor(multiplier * 2);
                score += holdScore;

                // Check if hold completed
                const tileY = currentHoldTile.y + offset;
                if (currentHoldTile.holdProgress >= 1 || (tileY + currentHoldTile.longDuration) > height) {
                    currentHoldTile.clicked = true;
                    currentHoldTile.isHolding = false;
                    currentHoldTile = null;
                }
            }

            let bottomTile = tiles[0];
            if (bottomTile.y + offset + (bottomTile.isLong ? bottomTile.longDuration : rowHeight) > height) {
                if (!bottomTile.clicked) {
                    gameOver();
                    return;
                } else {
                    tiles.shift();
                    let lastTile = tiles[tiles.length - 1];

                    // Decide if next tile is long
                    let shouldBeLong = currentTheme === 'longtile' && longTilesEnabled && Math.random() < 0.3;
                    let newTile = new Tile(lastTile.row + 1, shouldBeLong);
                    newTile.y = lastTile.y - (shouldBeLong ? newTile.longDuration : rowHeight);
                    tiles.push(newTile);
                }
            }

            tiles.forEach(t => t.draw(offset));

            updateHUD();

            requestAnimationFrame(loop);
        }

        function handleInteractionStart(e) {
            if (!gameRunning || gamePaused) return;

            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let clickX, clickY;

            if (e.touches) {
                clickX = e.touches[0].clientX - rect.left;
                clickY = e.touches[0].clientY - rect.top;
            } else {
                clickX = e.clientX - rect.left;
                clickY = e.clientY - rect.top;
            }

            let targetTile = null;
            for (let t of tiles) {
                if (!t.clicked) {
                    targetTile = t;
                    break;
                }
            }

            if (!targetTile) return;

            const tileHeight = targetTile.isLong ? targetTile.longDuration : rowHeight;
            let tileY = targetTile.y + offset;
            let tileX = targetTile.col * colWidth;

            if (clickY >= tileY && clickY <= tileY + tileHeight &&
                clickX >= tileX && clickX <= tileX + colWidth) {

                totalTaps++;
                perfectTaps++;
                combo++;
                maxCombo = Math.max(maxCombo, combo);
                updateComboMultiplier();

                if (targetTile.isLong) {
                    // Start holding
                    targetTile.isHolding = true;
                    currentHoldTile = targetTile;
                    holdStartTime = Date.now();

                    const baseScore = 200;
                    score += baseScore * multiplier;
                } else {
                    // Normal tap
                    targetTile.clicked = true;
                    const baseScore = 100;
                    score += baseScore * multiplier;
                }

                if ((currentTheme === 'cyberpunk' || currentTheme === 'longtile') && combo > 0 && combo % 10 === 0) {
                    document.getElementById('hudCombo').parentElement.classList.add('combo-animation');
                    setTimeout(() => {
                        document.getElementById('hudCombo').parentElement.classList.remove('combo-animation');
                    }, 300);
                }

                updateHUD();

            } else {
                if (clickY >= tileY && clickY <= tileY + tileHeight) {
                    totalTaps++;
                    combo = 0;
                    multiplier = 1;
                    gameOver();

                    if (currentTheme === 'cyberpunk') {
                        ctx.fillStyle = "rgba(255, 0, 229, 0.5)";
                    } else if (currentTheme === 'longtile') {
                        ctx.fillStyle = "rgba(233, 69, 96, 0.5)";
                    } else {
                        ctx.fillStyle = "red";
                    }
                    let col = Math.floor(clickX / colWidth);
                    ctx.fillRect(col * colWidth, tileY, colWidth, tileHeight);
                }
            }
        }

        function handleInteractionEnd(e) {
            if (!gameRunning || gamePaused) return;

            // Release hold
            if (currentHoldTile && currentHoldTile.isHolding) {
                if (currentHoldTile.holdProgress < 0.9) {
                    // Released too early
                    totalTaps++;
                    combo = 0;
                    multiplier = 1;
                    currentHoldTile = null;
                    gameOver();
                } else {
                    // Successfully completed hold
                    currentHoldTile.clicked = true;
                    currentHoldTile.isHolding = false;
                    currentHoldTile = null;

                    // Bonus points for completing hold
                    const bonusScore = 500 * multiplier;
                    score += bonusScore;
                    updateHUD();
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            currentHoldTile = null;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalCombo').innerText = maxCombo;
            const accuracy = totalTaps > 0 ? ((perfectTaps / totalTaps) * 100).toFixed(1) : 100;
            document.getElementById('finalAccuracy').innerText = accuracy;
            document.getElementById('gameOver').classList.remove('hidden');
            document.getElementById('hudOverlay').classList.remove('active');
        }

        canvas.addEventListener('mousedown', handleInteractionStart);
        canvas.addEventListener('touchstart', handleInteractionStart, { passive: false });
        canvas.addEventListener('mouseup', handleInteractionEnd);
        canvas.addEventListener('touchend', handleInteractionEnd, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (gameRunning) {
                    togglePause();
                }
            }
        });

    </script>
</body>
